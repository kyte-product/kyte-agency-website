  <path d="M274 223 C305 192 344 181 384 184 Q387 184 387 188 L387 337 Q387 340 384 342 C350 358 307 358 277 341 Q274 340 274 337 Z" fill="#fff"/>
  <path d="M183 205 Q183 202 186 199 C239 151 312 128 401 129 Q404 129 404 133 L387 185 C344 180 305 192 274 223 Z" fill="#fff"/>
  <path class="seam" d="M188 206 L271 223 M278 226 C307 196 344 185 382 186 M275 229 L275 333 M386 190 L386 331"/>
  <path d="M183 205 Q183 202 186 199 C239 151 312 128 401 129 Q404 129 404 133 L404 190 Q404 194 401 197 L387 224 L387 337 Q387 340 384 342 C350 358 307 358 277 341 Q274 340 274 337 L185 335 Q183 334 183 331 Z" class="contour"/>
  <ellipse cx="349" cy="156" rx="25" ry="14" fill="#e8eced"/>

  <!-- The right segment is a second solid with color contained inside its top face. -->
  <path d="M425 191 C481 201 531 231 552 264 Q555 268 555 272 L555 339 C555 365 470 395 372 392 Q368 392 368 388 L368 299 Q368 296 372 295 Z" fill="#edf0f1"/>
  <path d="M425 191 C481 201 531 231 552 264 Q555 268 551 269 L374 297 Q369 299 372 295 Z" fill="#c4f2e8"/>
  <g clip-path="url(#wedge-clip)">
