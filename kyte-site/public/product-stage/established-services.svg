  <path d="M324 312 L356 294 L356 414 Q356 417 353 419 L327 434 Q324 436 324 432 Z" fill="#edf0f1"/>
  <path class="seam" d="M299 295 L324 311 L352 296 M324 317 L324 428"/>
  <path d="M296 295 Q296 293 299 291 L322 278 Q325 276 328 278 L353 292 Q356 294 356 297 L356 414 Q356 417 353 419 L327 434 Q324 436 321 434 L296 420 Q294 418 294 415 L294 299 Q294 296 296 295 Z" class="contour"/>

