  <path d="M260 345 L291 327 L291 391 Q291 394 288 396 L263 411 Q260 413 260 409 Z" fill="#edf0f1"/>
  <path class="seam" d="M242 332 L260 344 L287 329 M260 350 L260 405"/>
  <path d="M239 332 Q239 330 242 328 L264 315 Q267 313 270 315 L288 325 Q291 327 291 330 L291 391 Q291 394 288 396 L263 411 Q260 413 257 411 L239 401 Q237 399 237 396 L237 336 Q237 333 239 332 Z" class="contour"/>

