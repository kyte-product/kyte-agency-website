    <circle cx="349" cy="82" r="34" fill="none" stroke="#fff" stroke-opacity=".44" stroke-width="6" filter="url(#edge-softness)"/>
  </g>
  <circle cx="349" cy="82" r="36.5" class="contour"/>
</svg>
