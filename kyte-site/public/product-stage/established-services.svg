  <path d="M172 334 L172 391 C172 456 259 507 368 507 C477 507 564 456 564 391 L564 334" class="contour"/>

  <!-- The floating sphere has local color fields and a restrained white inner edge. -->
  <g clip-path="url(#sphere-clip)">
    <circle cx="349" cy="82" r="37" fill="#66dcc9"/>
    <g filter="url(#soft-fields)">
      <ellipse cx="322" cy="96" rx="29" ry="35" fill="#46e4a8"/>
