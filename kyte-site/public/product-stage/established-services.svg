<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 552" role="img" aria-labelledby="title desc">
  <title id="title">Established services</title>
  <desc id="desc">A rounded circular platform carries three ascending bars and two raised segments, with a softly colored sphere above.</desc>
  <defs>
    <style>
      .contour { fill: none; stroke: #a8afb1; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .seam { fill: none; stroke: #e1e6e7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <clipPath id="sphere-clip"><circle cx="349" cy="82" r="36.5"/></clipPath>
    <clipPath id="wedge-clip"><path d="M425 191 C481 201 531 231 552 264 Q555 268 551 269 L374 297 Q369 299 372 295 Z"/></clipPath>
    <filter id="soft-fields" x="-50%" y="-70%" width="200%" height="240%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="edge-softness" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- A continuous, opaque neutral band gives the foundation its width. -->
