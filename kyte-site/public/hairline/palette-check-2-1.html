.web-face,.web-face *{box-sizing:border-box}
.web-face{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,Helvetica,sans-serif;--label:#eef0f0}
.web-face .bar{display:block;height:24px;border-radius:5px;background:var(--label)}
.web-face .field{position:relative;overflow:hidden;border-radius:12px;background:var(--art-greenBlue-mint);isolation:isolate}
.web-face .field .colors{position:absolute;inset:-20%;filter:blur(34px)}
.web-face .field .blob{position:absolute;border-radius:50%}
.web-face .field .blob:nth-child(1){left:-15%;top:20%;width:100%;height:110%;background:var(--art-greenBlue-mint)}
.web-face .field .blob:nth-child(2){right:-25%;top:-8%;width:70%;height:85%;background:var(--art-greenBlue-blueLight)}
.web-face .field .blob:nth-child(3){right:-26%;bottom:-20%;width:60%;height:55%;background:var(--art-greenBlue-blueLight)}
.web-face .field:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 36px 14px #ffffffb8;border-radius:inherit}
.web-face .browser-top{height:86px;padding:28px 40px;display:flex;align-items:center;gap:12px}
.web-face .dot{display:block;width:14px;height:14px;border-radius:50%;flex:none;background:var(--art-signal-error)}
.web-face .dot:nth-child(2){background:var(--art-signal-warning)}.web-face .dot:nth-child(3){background:var(--art-signal-success)}
.web-face .address{margin:auto;width:390px;height:22px;background:#f5f6f6;border-radius:5px}
.web-face .menu{width:65px;height:16px;background:#edf0f0;border-radius:4px}
.web-face .page{padding:44px 60px 46px}
.web-face .nav{display:flex;align-items:center;gap:28px;margin-bottom:54px;height:24px}
.web-face .nav .bar:first-child{width:135px;height:28px;margin-right:auto}
.web-face .nav .bar{width:82px;height:16px}
.web-face .hero{display:grid;grid-template-columns:1fr 1.04fr;gap:54px;align-items:center}
.web-face .headline{height:38px;width:96%;margin-bottom:20px}
.web-face .headline.short{width:69%;margin-bottom:30px}
.web-face .copy{height:19px;width:86%;margin-bottom:15px}
.web-face .copy.short{width:67%}
.web-face .button{width:146px;height:44px;margin-top:30px;background:#e9eded;border-radius:6px}
.web-face .hero .field{height:335px}
.web-face .modules{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:46px}
.web-face .module{padding:0}
.web-face .thumb{height:120px;background:#f2f4f4;border-radius:7px;margin-bottom:18px}
.web-face .module .bar{width:72%;height:17px;margin-bottom:11px}
.web-face .module .bar:last-child{width:53%;height:13px}
.web-face .component-body{padding:40px}
.web-face .component-head{display:flex;align-items:center;gap:20px;margin-bottom:32px}
.web-face .component-head .bar{width:60%;height:22px}
.web-face .component-head .bar:last-child{width:16%;height:16px;margin-left:auto}
.web-face .component-body .field{height:280px;display:grid;place-items:center;margin-bottom:32px}
.web-face .code{position:relative;width:112px;height:112px;color:white;z-index:1}
.web-face .component-body>.bar{width:88%;height:23px;margin-bottom:17px}
.web-face .component-body>.bar:last-child{width:61%;height:18px}
.preview{display:flex;gap:64px;align-items:start;padding:48px;background:#f8f9f9;min-height:100vh}
.preview-frame{width:650px;height:440px;flex:none}.preview-frame--component{width:260px;height:290px}

.saas-face,.saas-face *{box-sizing:border-box}
.saas-face{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,Helvetica,sans-serif;--label:#e9eded}
.saas-face i{display:block;font-style:normal}
.saas-face .bar{height:17px;border-radius:4px;background:var(--label);width:74%}
.saas-face .top{height:74px;padding:24px 32px;display:flex;align-items:center;gap:10px}
.saas-face .dot{width:12px;height:12px;border-radius:50%;background:#dce1e1}
.saas-face .address{width:400px;height:20px;border-radius:5px;background:#f2f4f4;margin:auto}
.saas-face .avatar{width:25px;height:25px;border-radius:50%;background:#e8eded}
.saas-face .app{display:grid;grid-template-columns:230px 1fr;height:806px}
.saas-face .sidebar{padding:35px 28px;background:#fafbfb}
.saas-face .brand{height:25px;width:130px;margin-bottom:57px;background:#dce3e3}
.saas-face .nav{height:48px;margin-bottom:23px;display:flex;gap:16px;align-items:center;padding:12px}
.saas-face .nav.active{background:#edf1f1;border-radius:7px}
.saas-face .nav i:first-child{height:21px;width:21px;background:#e1e7e7;border-radius:5px;flex:none}
.saas-face .nav .bar{height:15px;width:100px}
.saas-face .content{padding:36px 38px}
.saas-face .heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}
.saas-face .heading .bar{height:29px;width:266px}
.saas-face .heading .bar:last-child{height:34px;width:110px;background:#e7eded}
.saas-face .subhead{width:350px;height:15px;margin-bottom:34px}
.saas-face .filters{display:flex;gap:18px;margin-bottom:32px}
.saas-face .filters .bar{width:90px;height:15px}.saas-face .filters .bar:first-child{background:#d7dfdf}
.saas-face .board{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.saas-face .column{padding:20px 16px 18px;background:#f7f9f9;border-radius:8px}
.saas-face .column>.bar{width:63%;height:18px;margin-bottom:24px}
.saas-face .task{padding:22px 20px;background:white;border-radius:7px;margin-bottom:18px}
.saas-face .task .bar{height:14px;margin-bottom:12px;width:95%}.saas-face .task .bar.short{width:66%}
.saas-face .task-foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.saas-face .task-foot .bar{height:10px;width:68px;margin:0}
.saas-face .task-foot .avatar{height:20px;width:20px}
.saas-face .field{position:relative;isolation:isolate;overflow:hidden;background:var(--art-greenBlue-mint);border-radius:7px}
.saas-face .colors{position:absolute;inset:-20%;filter:blur(30px)}
.saas-face .blob{position:absolute;border-radius:50%;width:100%;height:110%;background:var(--art-greenBlue-mint);left:-20%;top:10%}
.saas-face .blob:nth-child(2){width:100%;height:100%;background:var(--art-greenBlue-blueLight);left:45%;top:-25%}
.saas-face .blob:nth-child(3){width:90%;height:60%;background:var(--art-greenBlue-mint);left:40%;top:70%}
.saas-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 30px 12px #ffffffb0;pointer-events:none}
.saas-face .column.field{position:relative}.saas-face .column.field>.bar,.saas-face .column.field>.task{position:relative;z-index:1}.saas-face .column.field>.bar{background:#ffffffbd}.saas-face .column.field>.task{background:#ffffffd9}.saas-face .task.field{height:146px}.saas-face .task.field>.bar,.saas-face .task.field>.task-foot{position:relative;z-index:1}.saas-face .task.field .bar{background:#ffffffa0}.saas-face .task.field .avatar{background:#ffffff9c}
.saas-face .insights{padding:36px 34px}
.saas-face .insights>.bar{height:22px;width:64%;margin-bottom:24px}
.saas-face .insights .field{height:286px;margin-bottom:29px;display:grid;place-items:center;background:var(--art-greenBlue-mint)}
.saas-face .insights .blob{background:var(--art-greenBlue-mint);left:-25%;top:-30%}
.saas-face .insights .blob:nth-child(2){background:var(--art-greenBlue-mint);left:45%;top:0}
.saas-face .insights .blob:nth-child(3){background:var(--art-greenBlue-blueLight);left:5%;top:65%}
.saas-face .code{position:relative;z-index:1;color:white;width:128px;height:128px}
.saas-face .metrics{display:flex;justify-content:space-between;gap:22px}
.saas-face .metric{width:48%}.saas-face .metric>.bar:first-child{width:74%;height:30px;margin-bottom:14px}.saas-face .metric>.bar:last-child{width:95%;height:13px}
