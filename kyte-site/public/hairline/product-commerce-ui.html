<!doctype html><html lang="en"><head><meta charset="utf-8"><title>eCommerce illustration: flat storefront and checkout</title><style>
.commerce-face,.commerce-face *{box-sizing:border-box}.commerce-face{width:100%;height:100%;background:white;overflow:hidden;font-family:Arial,Helvetica,sans-serif;--label:#e9eded}.commerce-face i{display:block;font-style:normal}.commerce-face .bar{height:18px;width:80%;background:var(--label);border-radius:4px}
.commerce-face .browser{height:72px;padding:26px 32px;display:flex;align-items:center;gap:11px}.commerce-face .dot{height:12px;width:12px;border-radius:50%;background:#dce2e2}.commerce-face .address{width:360px;height:20px;margin:auto;background:#f2f4f4;border-radius:4px}
.commerce-face .store{padding:28px 48px 40px}.commerce-face .nav{display:flex;align-items:center;gap:24px;margin-bottom:32px}.commerce-face .brand{width:166px;height:28px;margin-right:auto;background:#dee5e5}.commerce-face .nav .bar{width:72px;height:15px}.commerce-face .nav .bag{color:#b7c3c3;width:30px;height:30px;margin-left:16px}
.commerce-face .product{display:grid;grid-template-columns:1.12fr 1fr;gap:42px}.commerce-face .field{position:relative;overflow:hidden;isolation:isolate;border-radius:9px;background:var(--art-amberLime-light)}.commerce-face .colors{position:absolute;inset:-22%;filter:blur(35px)}.commerce-face .blob{position:absolute;border-radius:50%;left:-25%;top:15%;width:110%;height:115%;background:var(--art-amberLime-amber)}.commerce-face .blob:nth-child(2){left:52%;top:-25%;width:90%;height:100%;background:var(--art-amberLime-light)}.commerce-face .blob:nth-child(3){left:50%;top:55%;width:85%;height:80%;background:var(--art-amberLime-green)}.commerce-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 34px 13px #ffffffb0;pointer-events:none}
.commerce-face .product .field{height:330px;display:grid;place-items:center}.commerce-face .code{position:relative;z-index:1;color:white;width:146px;height:146px}.commerce-face .details{padding-top:26px}.commerce-face .details>.bar{width:93%;height:30px;margin-bottom:20px}.commerce-face .details>.bar.short{width:64%;margin-bottom:30px}.commerce-face .details>.bar.copy{height:17px;margin-bottom:15px;width:89%}.commerce-face .details>.bar.copy.short{width:69%;margin-bottom:30px}.commerce-face .swatches{display:flex;gap:15px;margin:28px 0}.commerce-face .swatches i{width:26px;height:26px;background:#e8eded;border-radius:50%}.commerce-face .swatches i:nth-child(2){background:#dce4e4}.commerce-face .swatches i:nth-child(3){background:#f1f3f3}.commerce-face .buy{height:42px!important;width:196px!important;border-radius:6px!important;background:#dde5e5!important}
.commerce-face .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:30px}.commerce-face .tile{height:120px;background:#f2f5f5;border-radius:7px;padding:23px;display:flex;align-items:center;gap:20px}.commerce-face .tile .thumb{height:74px;width:70px;border-radius:5px;background:#e8eeee;flex:none}.commerce-face .tile .bar{width:125px;height:14px;margin-bottom:13px}.commerce-face .tile .bar:last-child{width:80px;height:11px}
.commerce-face .checkout{padding:28px 40px}.commerce-face .checkout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.commerce-face .checkout-head>.bar{width:250px;height:25px}.commerce-face .checkout-head>.bar:last-child{width:105px;height:17px}.commerce-face .order{display:flex;align-items:center;gap:28px;margin-bottom:16px}.commerce-face .order .field{width:160px;height:140px;display:grid;place-items:center;background:var(--art-amberLime-light)}.commerce-face .order .blob{background:var(--art-amberLime-green)}.commerce-face .order .blob:nth-child(2){background:var(--art-amberLime-green)}.commerce-face .order .blob:nth-child(3){background:var(--art-amberLime-green)}.commerce-face .order .code{width:80px;height:80px}.commerce-face .order-copy{flex:1}.commerce-face .order-copy .bar{width:85%;height:24px;margin-bottom:20px}.commerce-face .order-copy .bar:last-child{width:52%;height:17px}.commerce-face .price{width:130px!important;height:28px!important}
.commerce-face .summary{display:flex;gap:26px;align-items:center;margin-top:20px}.commerce-face .summary .bar{height:17px;width:170px}.commerce-face .summary .bar:nth-child(2){width:120px}.commerce-face .summary .bar:last-child{height:44px;width:236px;margin-left:auto;background:#dde5e5;border-radius:6px}.commerce-face .checkout>.bar{width:230px;height:12px;margin-top:16px;background:#f0f3f3}
.preview{display:flex;gap:48px;align-items:start;padding:40px;background:#f8f9f9;min-height:100vh}.preview-frame{width:580px;height:312px;flex:none}.preview-frame--checkout{width:440px;height:180px}

/* Palette tokens start */
.commerce-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.commerce-face .field:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field:not(.brand-plane):before{display:none}.commerce-face .field:not(.brand-plane)>.colors{display:none}.commerce-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body><main class="preview" id="preview"></main>
<template id="storefront"><div class="commerce-face"><div class="browser"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="address"></i></div><div class="store"><div class="nav"><i class="bar brand"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><div class="product"><div class="field" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><svg xmlns="http://www.w3.org/2000/svg" class="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-icon="lucide-shopping-bag"><path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg></div><div class="details"><i class="bar"></i><i class="bar short"></i><i class="bar copy"></i><i class="bar copy short"></i><div class="swatches"><i></i><i></i><i></i></div><i class="bar buy"></i></div></div><div class="gallery"><div class="tile"><i class="thumb"></i><div><i class="bar"></i><i class="bar"></i></div></div><div class="tile"><i class="thumb"></i><div><i class="bar"></i><i class="bar"></i></div></div><div class="tile"><i class="thumb"></i><div><i class="bar"></i><i class="bar"></i></div></div></div></div></div></template>
<template id="checkout"><div class="commerce-face"><div class="checkout"><div class="checkout-head"><i class="bar"></i><i class="bar"></i></div><div class="order"><div class="field" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><svg xmlns="http://www.w3.org/2000/svg" class="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-icon="lucide-shopping-bag"><path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg></div><div class="order-copy"><i class="bar"></i><i class="bar"></i></div><i class="bar price"></i></div><div class="summary"><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><i class="bar"></i></div></div></template>
<script>for(const id of ['storefront','checkout']){const frame=document.createElement('div');frame.className='preview-frame'+(id==='checkout'?' preview-frame--checkout':'');const face=document.getElementById(id).content.firstElementChild.cloneNode(true);face.style.width=(id==='storefront'?1450:1100)+'px';face.style.height=(id==='storefront'?780:450)+'px';face.style.transform='scale(.4)';face.style.transformOrigin='top left';frame.append(face);document.getElementById('preview').append(frame)}</script>
</body></html>
