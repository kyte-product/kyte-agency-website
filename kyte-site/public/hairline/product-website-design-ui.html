<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Website design illustration: flat face layouts</title><style>
.web-face,.web-face *{box-sizing:border-box}
.web-face{width:100%;height:100%;background:#fff;overflow:hidden;font-family:Arial,Helvetica,sans-serif;--label:#eef0f0}
.web-face .bar{display:block;height:24px;border-radius:5px;background:var(--label)}
.web-face .field{position:relative;overflow:hidden;border-radius:12px;background:var(--art-greenBlue-mint);isolation:isolate}
.web-face .field .colors{position:absolute;inset:-20%;filter:blur(34px)}
.web-face .field .blob{position:absolute;border-radius:50%}
.web-face .field .blob:nth-child(1){left:-15%;top:20%;width:100%;height:110%;background:var(--art-greenBlue-mint)}
.web-face .field .blob:nth-child(2){right:-25%;top:-8%;width:70%;height:85%;background:var(--art-greenBlue-blueLight)}
.web-face .field .blob:nth-child(3){right:-26%;bottom:-20%;width:60%;height:55%;background:var(--art-greenBlue-blueLight)}
.web-face .field:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 36px 14px #ffffffb8;border-radius:inherit}
.web-face .browser-top{height:86px;padding:28px 40px;display:flex;align-items:center;gap:12px}
.web-face .dot{display:block;width:14px;height:14px;border-radius:50%;flex:none;background:var(--art-signal-error)}
.web-face .dot:nth-child(2){background:var(--art-signal-warning)}.web-face .dot:nth-child(3){background:var(--art-signal-success)}
.web-face .address{margin:auto;width:390px;height:22px;background:#f5f6f6;border-radius:5px}
.web-face .menu{width:65px;height:16px;background:#edf0f0;border-radius:4px}
.web-face .page{padding:44px 60px 46px}
.web-face .nav{display:flex;align-items:center;gap:28px;margin-bottom:54px;height:24px}
.web-face .nav .bar:first-child{width:135px;height:28px;margin-right:auto}
.web-face .nav .bar{width:82px;height:16px}
.web-face .hero{display:grid;grid-template-columns:1fr 1.04fr;gap:54px;align-items:center}
.web-face .headline{height:38px;width:96%;margin-bottom:20px}
.web-face .headline.short{width:69%;margin-bottom:30px}
.web-face .copy{height:19px;width:86%;margin-bottom:15px}
.web-face .copy.short{width:67%}
.web-face .button{width:146px;height:44px;margin-top:30px;background:#e9eded;border-radius:6px}
.web-face .hero .field{height:335px}
.web-face .modules{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:46px}
.web-face .module{padding:0}
.web-face .thumb{height:120px;background:#f2f4f4;border-radius:7px;margin-bottom:18px}
.web-face .module .bar{width:72%;height:17px;margin-bottom:11px}
.web-face .module .bar:last-child{width:53%;height:13px}
.web-face .component-body{padding:40px}
.web-face .component-head{display:flex;align-items:center;gap:20px;margin-bottom:32px}
.web-face .component-head .bar{width:60%;height:22px}
.web-face .component-head .bar:last-child{width:16%;height:16px;margin-left:auto}
.web-face .component-body .field{height:280px;display:grid;place-items:center;margin-bottom:32px}
.web-face .code{position:relative;width:112px;height:112px;color:white;z-index:1}
.web-face .component-body>.bar{width:88%;height:23px;margin-bottom:17px}
.web-face .component-body>.bar:last-child{width:61%;height:18px}
.preview{display:flex;gap:64px;align-items:start;padding:48px;background:#f8f9f9;min-height:100vh}
.preview-frame{width:650px;height:440px;flex:none}.preview-frame--component{width:260px;height:290px}

/* Palette tokens start */
.web-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.web-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.web-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.web-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.web-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.web-face .field:not(.brand-plane):before{display:none}.web-face .field:not(.brand-plane)>.colors{display:none}.web-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body><main class="preview" id="preview"></main>
<template id="browser"><div class="web-face"><div class="browser-top"><i class="dot" data-color-zone=""></i><i class="dot" data-color-zone=""></i><i class="dot" data-color-zone=""></i><i class="address"></i><i class="menu"></i></div><div class="page"><div class="nav"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><div class="hero"><div><i class="bar headline"></i><i class="bar headline short"></i><i class="bar copy"></i><i class="bar copy short"></i><i class="bar button"></i></div><div class="field" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div></div><div class="modules"><div class="module"><div class="thumb"></div><i class="bar"></i><i class="bar"></i></div><div class="module"><div class="thumb"></div><i class="bar"></i><i class="bar"></i></div><div class="module"><div class="thumb"></div><i class="bar"></i><i class="bar"></i></div></div></div></div></template>
<template id="component"><div class="web-face"><div class="component-body"><div class="component-head"><i class="bar"></i><i class="bar"></i></div><div class="field" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><svg xmlns="http://www.w3.org/2000/svg" class="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-icon="lucide-code-xml"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg></div><i class="bar"></i><i class="bar"></i></div></div></template>
<script>for(const id of ['browser','component']){const frame=document.createElement('div');frame.className='preview-frame'+(id==='component'?' preview-frame--component':'');const face=document.getElementById(id).content.firstElementChild.cloneNode(true);face.style.width=(id==='browser'?1300:520)+'px';face.style.height=(id==='browser'?880:580)+'px';face.style.transform='scale(.5)';face.style.transformOrigin='top left';frame.append(face);document.getElementById('preview').append(frame)}</script>
</body></html>
