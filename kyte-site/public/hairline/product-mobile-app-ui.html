<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mobile illustration flat layouts</title><style>
.mobile-face,.mobile-face *{box-sizing:border-box}
.mobile-face{width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif;position:relative;--pale:#edf0f0}
.mobile-face .bar{display:block;height:24px;border-radius:7px;background:var(--pale)}
.mobile-face .earpiece{position:absolute;left:310px;top:32px;width:140px;height:14px;border-radius:7px;background:#e8ebeb}
.mobile-face .phone-body{padding:116px 66px 90px}
.mobile-face .app-head{display:flex;align-items:center;gap:30px;margin-bottom:58px}
.mobile-face .avatar{display:block;width:68px;height:68px;background:#f0f2f2;border-radius:50%;flex:none}
.mobile-face .app-title{flex:1}.mobile-face .app-title .bar{width:66%;height:25px;margin-bottom:15px}.mobile-face .app-title .bar:last-child{width:42%;height:17px;margin:0}
.mobile-face .summary{height:314px;border-radius:12px;background:#f4f5f5;margin-bottom:52px}
.mobile-face .section-title{width:45%;height:26px;margin-bottom:34px}
.mobile-face .row{display:flex;align-items:center;gap:28px;margin-bottom:36px}
.mobile-face .row .avatar{width:64px;height:64px;border-radius:12px}
.mobile-face .row .text{flex:1}.mobile-face .row .bar{width:84%;height:22px;margin-bottom:16px}.mobile-face .row .bar:last-child{width:56%;height:16px;margin:0}
.mobile-face .home{position:absolute;width:184px;height:14px;border-radius:7px;bottom:32px;left:288px;background:#e8ebeb}
.mobile-face.interaction{background:var(--art-pinkViolet-pink);border-radius:28px;isolation:isolate;padding:54px}
.mobile-face.interaction .colors{position:absolute;inset:-22%;filter:blur(42px);z-index:-1}
.mobile-face.interaction .blob{position:absolute;border-radius:50%}
.mobile-face.interaction .blob:nth-child(1){left:-4%;top:-10%;width:85%;height:100%;background:var(--art-pinkViolet-coral)}
.mobile-face.interaction .blob:nth-child(2){right:-10%;top:15%;width:80%;height:100%;background:var(--art-pinkViolet-deep)}
.mobile-face.interaction .blob:nth-child(3){right:-10%;bottom:-35%;width:78%;height:90%;background:var(--art-pinkViolet-violet)}
.mobile-face.interaction:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 38px 14px #ffffffb3;pointer-events:none}
.mobile-face.interaction .bar{background:#ffffffa6;height:24px;width:48%;margin-bottom:20px;border-radius:6px}
.mobile-face.interaction .bar.short{width:31%;height:17px}
.mobile-face .action-rows{position:absolute;left:54px;bottom:56px;width:270px}
.mobile-face .action-rows .bar{width:100%;height:18px;margin-bottom:20px}.mobile-face .action-rows .bar:nth-child(2){width:82%}.mobile-face .action-rows .bar:last-child{width:62%;margin-bottom:0}
.mobile-face .pointer{position:absolute;width:138px;height:138px;right:80px;top:196px;color:#fff}
.preview{display:flex;align-items:start;gap:64px;background:#f8f9f9;min-height:100vh;padding:40px}
.preview-frame{width:304px;height:520px;flex:none}.preview-frame--interaction{width:272px;height:192px;margin-top:100px}

/* Palette tokens start */
.mobile-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.mobile-face .field:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field:not(.brand-plane):before{display:none}.mobile-face .field:not(.brand-plane)>.colors{display:none}.mobile-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face.interaction{background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face.interaction>.colors{display:none}.mobile-face.interaction:after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body><main class="preview" id="preview"></main>
<template id="phone"><div class="mobile-face"><i class="earpiece"></i><div class="phone-body"><div class="app-head"><i class="avatar"></i><div class="app-title"><i class="bar"></i><i class="bar"></i></div></div><div class="summary"></div><i class="bar section-title"></i><div class="row"><i class="avatar"></i><div class="text"><i class="bar"></i><i class="bar"></i></div></div><div class="row"><i class="avatar"></i><div class="text"><i class="bar"></i><i class="bar"></i></div></div><div class="row"><i class="avatar"></i><div class="text"><i class="bar"></i><i class="bar"></i></div></div></div><i class="home"></i></div></template>
<template id="interaction"><div class="mobile-face interaction" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><i class="bar"></i><i class="bar short"></i><div class="action-rows"><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><svg xmlns="http://www.w3.org/2000/svg" class="pointer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-icon="lucide-pointer"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></div></template>
<script>for(const id of ['phone','interaction']){const frame=document.createElement('div');frame.className='preview-frame'+(id==='interaction'?' preview-frame--interaction':'');const face=document.getElementById(id).content.firstElementChild.cloneNode(true);face.style.width=(id==='phone'?760:680)+'px';face.style.height=(id==='phone'?1300:480)+'px';face.style.transform='scale(.4)';face.style.transformOrigin='top left';frame.append(face);document.getElementById('preview').append(frame)}</script>
</body></html>
