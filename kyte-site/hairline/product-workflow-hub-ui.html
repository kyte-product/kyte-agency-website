<!doctype html><html lang="en"><meta charset="utf-8"><title>Workflow hub: measured top faces</title><style>
.workflow-face,.workflow-face *{box-sizing:border-box}.workflow-face{width:100%;height:100%;overflow:hidden;background:white;font-family:Arial,sans-serif;color:#bcc8c7}.workflow-face .bar{display:block;height:16px;background:#e9eeed;border-radius:5px}.workflow-face .native{width:70px;height:70px;color:currentColor;position:relative;z-index:1}.workflow-face .field{position:relative;overflow:hidden;isolation:isolate;border-radius:14px;background:var(--art-greenBlue-mint)}.workflow-face .colors{position:absolute;inset:-24%;filter:blur(26px)}.workflow-face .blob{position:absolute;left:-30%;top:-10%;width:110%;height:110%;border-radius:50%;background:var(--art-greenBlue-mint)}.workflow-face .blob:nth-child(2){left:40%;top:-25%;background:var(--art-mintCyan-cyan)}.workflow-face .blob:nth-child(3){left:30%;top:60%;background:var(--art-mintCyan-cyan)}.workflow-face .field:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 23px 8px #ffffffa8;border-radius:inherit;pointer-events:none}.workflow-face .warm .blob:first-child{background:var(--art-amberLime-light)}.workflow-face .warm .blob:nth-child(2){background:var(--art-pinkViolet-coral)}.workflow-face .warm .blob:nth-child(3){background:var(--art-mintCyan-green)}.workflow-face .violet .blob:first-child{background:var(--art-pinkViolet-rose)}.workflow-face .violet .blob:nth-child(2){background:var(--art-pinkViolet-violet)}.workflow-face .violet .blob:nth-child(3){background:var(--art-pinkViolet-violet)}
.workflow-face .module-body{padding:43px}.workflow-face .module-icon{height:205px;display:grid;place-items:center;margin-bottom:31px}.workflow-face .module-icon .native{width:110px;height:110px;color:white}.workflow-face .module-body>.bar{height:18px;width:84%;margin:0 auto 16px}.workflow-face .module-body>.bar:last-child{height:12px;width:57%}
.workflow-face .console-body{padding:174px 135px 140px}.workflow-face .console-header{display:flex;align-items:center;gap:25px;margin-bottom:43px}.workflow-face .console-header .native{width:46px;height:46px}.workflow-face .console-header .bar{height:24px;width:220px}.workflow-face .console-header .dot{width:17px;height:17px;border-radius:50%;background:#d8e9e2;margin-left:auto}.workflow-face .metrics{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}.workflow-face .ring{width:225px;height:225px;border-radius:50%;mask:radial-gradient(circle,transparent 48%,black 49%);-webkit-mask:radial-gradient(circle,transparent 48%,black 49%)}.workflow-face .ring:after{box-shadow:inset 0 0 16px 5px #ffffff90}.workflow-face .chart{height:210px;display:flex;gap:13px;align-items:end;padding-bottom:15px;border-bottom:3px solid #edf2f0}.workflow-face .column{flex:1;border-radius:7px 7px 0 0}.workflow-face .column:nth-child(1){height:37%}.workflow-face .column:nth-child(2){height:64%}.workflow-face .column:nth-child(3){height:50%}.workflow-face .column:nth-child(4){height:83%}.workflow-face .column:nth-child(5){height:100%}.workflow-face .column:after{box-shadow:inset 0 0 11px 3px #ffffff98}.workflow-face .column .colors{filter:blur(18px)}.workflow-face .metric-labels{display:grid;grid-template-columns:1fr 1fr;gap:45px;margin-top:26px}.workflow-face .metric-labels .bar{width:80%;height:15px;margin-bottom:12px}.workflow-face .metric-labels .bar:last-child{width:52%;height:10px}.workflow-face .status-row{margin-top:38px;display:flex;gap:18px;align-items:center;padding:20px;background:#f6f8f7;border-radius:12px}.workflow-face .status-row .native{width:29px;height:29px}.workflow-face .status-row .bar{width:60%;height:12px}
.workflow-face .queue-body{padding:36px}.workflow-face .queue-head{display:flex;align-items:center;gap:20px;margin-bottom:25px}.workflow-face .queue-head .native{width:35px;height:35px}.workflow-face .queue-head .bar{width:57%;height:17px}.workflow-face .task-row{display:flex;align-items:center;gap:17px;margin-bottom:18px}.workflow-face .task-row .native{width:22px;height:22px}.workflow-face .task-row .bar{height:12px;width:70%}.workflow-face .queue-progress{height:27px;width:80%;margin-top:22px;border-radius:7px}.workflow-face .queue-progress:after{box-shadow:inset 0 0 9px 2px #ffffffa0}.workflow-face .queue-progress .colors{filter:blur(10px)}.workflow-face .ghost{padding:35px}.workflow-face .ghost .bar{height:13px;width:76%;margin-bottom:23px}
.preview{display:flex;flex-wrap:wrap;gap:24px;padding:30px;background:#f8f9f9}

.workflow-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.workflow-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.workflow-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.workflow-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.workflow-face .field:not(.brand-plane):before{display:none}.workflow-face .field:not(.brand-plane)>.colors{display:none}.workflow-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}

</style><body><main class="preview"></main>
<template id="console"><div class="workflow-face"><div class="console-body"><div class="console-header">{{CHART}}<i class="bar"></i><i class="dot"></i></div><div class="metrics"><div class="field ring" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="chart"><div class="field violet column" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="field violet column" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="field violet column" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="field violet column" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="field violet column" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div></div></div><div class="metric-labels"><div><i class="bar"></i><i class="bar"></i></div><div><i class="bar"></i><i class="bar"></i></div></div><div class="status-row">{{BRANCH}}<i class="bar"></i></div></div></div></template>
<template id="intake"><div class="workflow-face"><div class="module-body"><div class="field warm module-icon" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>{{INBOX}}</div><i class="bar"></i><i class="bar"></i></div></div></template>
<template id="routing"><div class="workflow-face"><div class="module-body"><div class="field violet module-icon" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>{{BRANCH}}</div><i class="bar"></i><i class="bar"></i></div></div></template>
<template id="complete"><div class="workflow-face"><div class="module-body"><div class="field module-icon" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>{{CHECK}}</div><i class="bar"></i><i class="bar"></i></div></div></template>
<template id="queue"><div class="workflow-face"><div class="queue-body"><div class="queue-head">{{TASK}}<i class="bar"></i></div><div class="task-row">{{CHECK}}<i class="bar"></i></div><div class="task-row">{{CHECK}}<i class="bar"></i></div><div class="task-row">{{CHECK}}<i class="bar"></i></div><div class="field warm queue-progress" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div></div></div></template>
<template id="queue-back"><div class="workflow-face"><div class="ghost"><i class="bar"></i><i class="bar"></i><i class="bar"></i></div></div></template>
<script>for(const [id,w,h]of [['console',880,880],['intake',420,420],['routing',420,420],['complete',420,420],['queue',560,380],['queue-back',560,380]]){const frame=document.createElement('div');frame.style.width=w*.5+'px';frame.style.height=h*.5+'px';const face=document.getElementById(id).content.firstElementChild.cloneNode(true);face.style.width=w+'px';face.style.height=h+'px';face.style.transform='scale(.5)';face.style.transformOrigin='top left';frame.append(face);document.querySelector('main').append(frame)}</script></body></html>
