<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Website assembly flat faces</title><style>
html,body{margin:0;background:#ecefef}body{display:flex;flex-wrap:wrap;gap:26px;padding:24px;align-items:start}.preview{overflow:hidden;position:relative}.website-face,.website-face *{box-sizing:border-box}.website-face{position:relative;background:white;color:#a2adb2;font:24px Arial,sans-serif;overflow:hidden;padding:46px}.website-face .native{display:block;width:100%;height:100%}.website-face .icon{display:block;width:54px;height:54px;flex-shrink:0}.website-face .bar{display:block;background:#e4e9ec;height:19px;border-radius:6px;width:100%;margin:20px 0}.website-face .short{width:64%}.website-face .small{width:38%}.website-face .field{position:relative;isolation:isolate;overflow:hidden;background:var(--art-greenBlue-mint);border-radius:14px}.website-face .field:before{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse at 84% 12%,var(--art-greenBlue-blueLight) 0,transparent 53%),radial-gradient(ellipse at 12% 84%,var(--art-greenBlue-mint) 0,transparent 56%);filter:blur(26px);z-index:-1}.website-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 28px 7px #ffffff77;pointer-events:none}.website-face .pink{background:var(--art-pinkViolet-base)}.website-face .pink:before{background:radial-gradient(ellipse at 87% 86%,var(--art-pinkViolet-violet) 0,transparent 59%),radial-gradient(ellipse at 8% 12%,var(--art-pinkViolet-light) 0,transparent 55%)}.website-face .warm{background:var(--art-amberLime-light)}.website-face .warm:before{background:radial-gradient(ellipse at 82% 20%,var(--art-greenBlue-mint) 0,transparent 58%),radial-gradient(ellipse at 10% 82%,var(--art-amberLime-light) 0,transparent 55%)}.website-face .chrome{display:flex;align-items:center;gap:16px;height:64px;margin-bottom:42px}.website-face .lights{display:flex;gap:12px;margin-right:24px}.website-face .lights i{display:block;width:12px;height:12px;border-radius:50%;background:#dce4e6}.website-face .chrome .bar{width:110px;height:12px;margin-left:12px}.website-face .chrome .icon{width:40px;height:40px;margin-left:auto}.website-face .hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:50px;align-items:center;margin-top:35px}.website-face .headline .bar{height:38px;margin:22px 0}.website-face .description{margin-top:40px}.website-face .description .bar{height:13px}.website-face .action{width:210px;height:66px;margin-top:34px;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}.website-face .action .bar{background:#ffffffaa;width:100px;height:11px;margin:0}.website-face .action .icon{color:white;width:30px;height:30px}.website-face .feature{height:410px;display:grid;place-items:center}.website-face .feature .icon{color:white;width:100px;height:100px}.website-face .modules{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px}.website-face .module{background:#f5f7f8;padding:20px;border-radius:10px;display:flex;gap:18px;align-items:center;height:124px}.website-face .module .icon{width:40px;height:40px}.website-face .module .bar{height:12px;margin:10px 0}.website-face .cube-content{display:flex;flex-direction:column;height:100%;justify-content:center;gap:22px}.website-face .cube-content>.field{height:235px;display:grid;place-items:center}.website-face .cube-content>.field .icon{width:98px;height:98px;color:white}.website-face .cube-content .bar{margin:0;height:18px}.website-face .code-panel{height:100%;display:flex;flex-direction:column;gap:25px;justify-content:start}.website-face .code-panel>.field{height:150px;flex-shrink:0;margin-bottom:140px;display:grid;place-items:center}.website-face .code-panel .icon{width:100px;height:100px;color:white}.website-face .code-line{display:flex;gap:18px;align-items:center}.website-face .code-line i{height:17px;background:#dfe5e8;display:block;border-radius:4px}.website-face .page-layout{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;height:100%}.website-face .page-layout>.field{height:100%;display:grid;place-items:center}.website-face .page-layout .icon{color:white;width:110px;height:110px}.website-face .page-copy>.icon{color:#bec8cb;width:56px;height:56px;margin-bottom:36px}.website-face .page-copy .bar{height:27px}.website-face .page-copy .action{width:170px;height:58px}.website-face .publish-inner{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;padding:48px;display:grid;place-items:center}.website-face .publish-inner .field{width:100%;height:100%;border-radius:50%;display:grid;place-items:center}.website-face .publish-inner .icon{width:160px;height:160px;color:white}
.website-face .brand-plane{background:#fff}.website-face .brand-plane:before,.website-face .brand-plane:after{display:none}.website-face .brand-logo{object-fit:contain}.website-face .top-logo{height:100%;width:100%;display:grid;place-items:center}.website-face .top-logo .icon{width:220px;height:130px}.website-face .page-copy>.bar{height:22px;margin:0 0 22px}.website-face .page-copy>.bar.short{height:16px;width:68%;margin-bottom:0}.website-face .page-copy .action{width:190px;height:64px;padding:16px 20px;margin-top:34px}.website-face .page-copy .action .bar{width:90px;height:10px;margin:0}.website-face .page-copy .action .icon{width:30px;height:30px;flex-shrink:0}
/* Palette tokens start */
.website-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.website-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.website-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.website-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.website-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.website-face .field:not(.brand-plane):before{display:none}.website-face .field:not(.brand-plane)>.colors{display:none}.website-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body>
<template id="browser"><div class="website-face"><div class="chrome"><div class="lights"><i></i><i></i><i></i></div><b class="bar"></b><b class="bar"></b><b class="bar"></b><span class="icon">{{LAYOUT}}</span></div><div class="hero"><div><div class="headline"><b class="bar"></b><b class="bar"></b><b class="bar short"></b></div><div class="description"><b class="bar"></b><b class="bar short"></b></div><div class="field pink action" data-color-zone=""><b class="bar"></b><span class="icon">{{ARROW}}</span></div></div><div class="feature field" data-color-zone=""><span class="icon">{{IMAGE}}</span></div></div><div class="modules"><div class="module"><span class="icon">{{LAYOUT}}</span><div style="flex:1"><b class="bar"></b><b class="bar short"></b></div></div><div class="module"><span class="icon">{{CODE}}</span><div style="flex:1"><b class="bar"></b><b class="bar short"></b></div></div><div class="module"><span class="icon">{{CHECK}}</span><div style="flex:1"><b class="bar"></b><b class="bar short"></b></div></div></div></div></template>
<template id="content"><div class="website-face"><div class="cube-content"><div class="field brand-plane" data-color-zone=""><span class="icon" style="width:270px;height:150px">{{SANITY}}</span></div><b class="bar"></b><b class="bar short"></b></div></div></template>
<template id="development"><div class="website-face"><div class="code-panel"><b class="bar" style="width:65%;height:22px;margin-bottom:125px"></b><div class="code-line"><i style="width:30px"></i><i style="width:170px"></i></div><div class="code-line" style="padding-left:30px"><i style="width:100px"></i><i style="width:110px"></i></div></div></div></template>
<template id="development-top"><div class="website-face"><div class="top-logo" data-color-zone=""><span class="icon">{{WEBFLOW}}</span></div></div></template>
<template id="page"><div class="website-face"><div class="page-layout"><div class="field brand-plane" data-color-zone=""><span class="icon" style="width:130px;height:180px">{{FRAMER}}</span></div><div class="page-copy"><b class="bar"></b><b class="bar short"></b><div class="action field pink" data-color-zone=""><b class="bar"></b><span class="icon">{{ARROW}}</span></div></div></div></div></template>
<template id="publish"><div class="website-face"><div class="publish-inner"><div class="field brand-plane" data-color-zone=""><span class="icon">{{WORDPRESS}}</span></div></div></div></template>
<script>const sizes={"development-top":[480,480],browser:[1460,900],content:[440,540],development:[480,660],page:[1000,540],publish:[500,500]};for(const t of document.querySelectorAll('template')){const [w,h]=sizes[t.id],wrap=document.createElement('div');wrap.className='preview';wrap.style.cssText=`width:${w*.5}px;height:${h*.5}px`;wrap.innerHTML=t.innerHTML;wrap.firstElementChild.style.cssText+=`;width:${w}px;height:${h}px;transform:scale(.5);transform-origin:0 0`;document.body.append(wrap)}</script></body></html>
