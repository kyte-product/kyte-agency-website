<!doctype html><html lang="en"><meta charset="utf-8"><title>Design patterns: measured component faces</title><style>
.patterns-face,.patterns-face *{box-sizing:border-box}.patterns-face{width:100%;height:100%;overflow:hidden;background:white;font-family:Arial,sans-serif;color:#bcc8c6}.patterns-face .bar{display:block;height:17px;background:#e9eeec;border-radius:5px}.patterns-face .native{width:45px;height:45px;position:relative;z-index:1;color:currentColor}.patterns-face .field{position:relative;overflow:hidden;isolation:isolate;border-radius:13px;background:var(--art-greenBlue-mint)}.patterns-face .colors{position:absolute;inset:-24%;filter:blur(27px)}.patterns-face .blob{position:absolute;left:-30%;top:-15%;width:110%;height:110%;border-radius:50%;background:var(--art-greenBlue-mint)}.patterns-face .blob:nth-child(2){left:45%;top:-30%;background:var(--art-greenBlue-blueLight)}.patterns-face .blob:nth-child(3){left:25%;top:65%;background:var(--art-greenBlue-mint)}.patterns-face .field:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 23px 8px #ffffffa8;border-radius:inherit;pointer-events:none}.patterns-face .warm .blob:first-child{background:var(--art-amberLime-light)}.patterns-face .warm .blob:nth-child(2){background:var(--art-pinkViolet-coral)}.patterns-face .warm .blob:nth-child(3){background:var(--art-greenBlue-mint)}.patterns-face .violet .blob:first-child{background:var(--art-pinkViolet-light)}.patterns-face .violet .blob:nth-child(2){background:var(--art-pinkViolet-violet)}.patterns-face .violet .blob:nth-child(3){background:var(--art-pinkViolet-violet)}
.patterns-face .foundation-body{padding:48px}.patterns-face .foundation-head{display:flex;gap:25px;align-items:center;margin-bottom:40px}.patterns-face .foundation-head .bar{width:25%;height:20px}.patterns-face .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.patterns-face .slot{height:210px;background:#f7f9f8;border-radius:12px;display:grid;place-items:center}.patterns-face .slot .native{width:28px;height:28px;color:#dce5e1}.patterns-face .spacing{display:flex;gap:20px;align-items:center;margin-top:37px}.patterns-face .spacing i{width:28px;height:28px;background:#edf2f0;border-radius:5px}.patterns-face .spacing i:nth-child(2){width:42px}.patterns-face .spacing i:nth-child(3){width:56px}.patterns-face .spacing i:nth-child(4){width:84px}.patterns-face .spacing .bar{width:200px;height:15px;margin-left:auto}
.patterns-face .library-body{padding:40px}.patterns-face .library-head{display:flex;gap:22px;align-items:center;margin-bottom:36px}.patterns-face .library-head .bar{width:42%;height:24px}.patterns-face .controls{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}.patterns-face .control-group{padding:25px;background:#f7f9f8;border-radius:13px;min-height:170px}.patterns-face .control-group>.bar{width:58%;height:13px;margin-bottom:27px}.patterns-face .button{height:64px;display:flex;justify-content:center;align-items:center;gap:17px}.patterns-face .button .bar{width:42%;height:14px;background:#ffffffb0;position:relative;z-index:1}.patterns-face .button .native{width:24px;height:24px;color:#fff}.patterns-face .button:after{box-shadow:inset 0 0 15px 4px #ffffff9c}.patterns-face .button .colors{filter:blur(17px)}.patterns-face .toggle-row{display:flex;align-items:center;gap:25px}.patterns-face .toggle{width:116px;height:60px;border-radius:32px;padding:8px}.patterns-face .toggle:after{border-radius:32px;box-shadow:inset 0 0 12px 3px #ffffff90}.patterns-face .knob{display:block;width:44px;height:44px;background:#fff;border-radius:50%;margin-left:auto;position:relative;z-index:1}.patterns-face .toggle-row>.bar{flex:1;height:14px}.patterns-face .input{height:63px;background:#fff;border-radius:8px;padding:21px;display:flex;gap:18px;align-items:center}.patterns-face .input .native{width:24px;height:24px}.patterns-face .input .bar{width:60%;height:12px}.patterns-face .choices{display:flex;gap:18px;align-items:center}.patterns-face .checkbox{width:43px;height:43px;border-radius:10px;background:#e1eee7;display:grid;place-items:center}.patterns-face .checkbox .native{width:28px;height:28px;color:#b0c7bd}.patterns-face .choices>.bar{width:45%;height:13px}.patterns-face .chips{display:flex;gap:18px;margin-top:33px}.patterns-face .chip{height:43px;flex:1;background:#edf3f0;border-radius:10px;display:grid;place-items:center}.patterns-face .chip .bar{width:58%;height:10px}
.patterns-face .tokens-body{padding:28px}.patterns-face .type{font-size:83px;font-weight:500;line-height:1.1;color:#afbdb9;letter-spacing:-4px;margin:13px 0 23px}.patterns-face .type-lines .bar{height:12px;width:85%;margin-bottom:14px}.patterns-face .type-lines .bar:last-child{width:59%;height:9px}.patterns-face .palette{display:flex;flex-direction:column;gap:17px;margin-top:37px}.patterns-face .swatch{height:118px;border-radius:12px}.patterns-face .swatch .colors{filter:blur(20px)}.patterns-face .swatch:after{box-shadow:inset 0 0 20px 6px #ffffffa0}
.patterns-face .pattern-body{padding:37px}.patterns-face .pattern-head{display:flex;gap:20px;align-items:center;margin-bottom:26px}.patterns-face .avatar{width:52px;height:52px;border-radius:50%;background:#eaf1ed;display:grid;place-items:center}.patterns-face .avatar .native{width:29px;height:29px;color:#bdccc5}.patterns-face .pattern-title{flex:1}.patterns-face .pattern-title .bar{width:66%;height:17px;margin-bottom:12px}.patterns-face .pattern-title .bar:last-child{width:43%;height:11px;margin:0}.patterns-face .feature{height:215px;display:grid;place-items:center;margin-bottom:27px}.patterns-face .feature .native{width:85px;height:85px;color:#fff}.patterns-face .headline{width:88%;height:23px;margin-bottom:17px}.patterns-face .copy{width:96%;height:12px;margin-bottom:13px}.patterns-face .copy.short{width:68%}.patterns-face .pattern-action{display:flex;gap:22px;align-items:center;margin-top:29px}.patterns-face .pattern-action .button{width:58%;height:56px}.patterns-face .pattern-action>.bar{width:24%;height:12px}
.preview{display:flex;flex-wrap:wrap;gap:24px;padding:30px;background:#f8f9f9}

/* Palette tokens start */
.patterns-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.patterns-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.patterns-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.patterns-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.patterns-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.patterns-face .field:not(.brand-plane):before{display:none}.patterns-face .field:not(.brand-plane)>.colors{display:none}.patterns-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style><body><main class="preview"></main>
<template id="foundation"><div class="patterns-face"><div class="foundation-body"><div class="foundation-head">{{GRID}}<i class="bar"></i></div><div class="slots"><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div><div class="slot">{{PLUS}}</div></div><div class="spacing"><i></i><i></i><i></i><i></i><b class="bar"></b></div></div></div></template>
<template id="library"><div class="patterns-face"><div class="library-body"><div class="library-head">{{LAYERS}}<i class="bar"></i></div><div class="controls"><div class="control-group"><i class="bar"></i><div class="field violet button" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><i class="bar"></i>{{ARROW}}</div></div><div class="control-group"><i class="bar"></i><div class="toggle-row"><div class="field toggle" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><i class="knob"></i></div><i class="bar"></i></div></div><div class="control-group"><i class="bar"></i><div class="input">{{SEARCH}}<i class="bar"></i></div></div><div class="control-group"><i class="bar"></i><div class="choices"><div class="checkbox">{{CHECK}}</div><i class="bar"></i></div></div></div><div class="chips"><div class="chip"><i class="bar"></i></div><div class="chip"><i class="bar"></i></div><div class="chip"><i class="bar"></i></div></div></div></div></template>
<template id="tokens"><div class="patterns-face"><div class="tokens-body"><div class="type">Aa</div><div class="type-lines"><i class="bar"></i><i class="bar"></i></div><div class="palette"><div class="field swatch" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="field violet swatch" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div><div class="field warm swatch" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div></div></div></div></div></template>
<template id="pattern"><div class="patterns-face"><div class="pattern-body"><div class="pattern-head"><div class="avatar">{{USER}}</div><div class="pattern-title"><i class="bar"></i><i class="bar"></i></div></div><div class="field feature" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>{{LAYERS}}</div><i class="bar headline"></i><i class="bar copy"></i><i class="bar copy short"></i><div class="pattern-action"><div class="field violet button" data-color-zone=""><div class="colors"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div><i class="bar"></i>{{ARROW}}</div><i class="bar"></i></div></div></div></template>
<script>for(const [id,w,h]of [['foundation',1040,1000],['library',900,800],['tokens',300,820],['pattern',650,670]]){const frame=document.createElement('div');frame.style.width=w*.5+'px';frame.style.height=h*.5+'px';const face=document.getElementById(id).content.firstElementChild.cloneNode(true);face.style.width=w+'px';face.style.height=h+'px';face.style.transform='scale(.5)';face.style.transformOrigin='top left';frame.append(face);document.querySelector('main').append(frame)}</script></body></html>
