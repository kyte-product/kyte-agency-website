<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SaaS assembly flat faces</title><style>
html,body{margin:0;background:#ecefef}body{display:flex;flex-wrap:wrap;gap:26px;padding:24px;align-items:start}.preview{overflow:hidden;position:relative}.saas-face,.saas-face *{box-sizing:border-box}.saas-face{position:relative;background:white;color:#a4afb3;overflow:hidden;padding:44px;font:24px Arial,sans-serif}.saas-face .native{display:block;width:100%;height:100%}.saas-face .icon{display:block;width:54px;height:54px;flex-shrink:0}.saas-face .bar{display:block;background:#e3e9eb;height:20px;border-radius:6px;width:100%;margin:20px 0}.saas-face .short{width:64%}.saas-face .small{width:38%}.saas-face .field{position:relative;isolation:isolate;overflow:hidden;background:var(--art-greenBlue-mint);border-radius:16px}.saas-face .field:before{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse at 84% 14%,var(--art-greenBlue-blueLight) 0,transparent 53%),radial-gradient(ellipse at 12% 84%,var(--art-greenBlue-mint) 0,transparent 56%);filter:blur(27px);z-index:-1}.saas-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 28px 7px #ffffff77;pointer-events:none}.saas-face .pink{background:var(--art-pinkViolet-base)}.saas-face .pink:before{background:radial-gradient(ellipse at 87% 86%,var(--art-pinkViolet-violet) 0,transparent 59%),radial-gradient(ellipse at 8% 12%,var(--art-pinkViolet-light) 0,transparent 55%)}.saas-face .warm{background:var(--art-amberLime-light)}.saas-face .warm:before{background:radial-gradient(ellipse at 84% 16%,var(--art-greenBlue-mint) 0,transparent 58%),radial-gradient(ellipse at 10% 82%,var(--art-amberLime-light) 0,transparent 55%)}.saas-face .chrome{height:76px;display:flex;align-items:center;gap:24px;margin-bottom:35px}.saas-face .chrome>.bar{height:24px;width:280px}.saas-face .chrome .menu{margin-left:auto;display:flex;gap:14px}.saas-face .chrome .menu i{width:14px;height:14px;border-radius:50%;background:#dce5e8}.saas-face .lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.saas-face .lane{padding:24px;background:#f6f8f9;border-radius:14px}.saas-face .lane>.bar{height:17px;width:150px;margin-top:0;margin-bottom:24px}.saas-face .task{height:310px;padding:30px;display:flex;flex-direction:column;justify-content:space-between}.saas-face .task .icon{color:#fff;width:130px;height:130px}.saas-face .task .bar{background:#ffffffa9;height:17px;margin:16px 0}.saas-face .task .bar.short{height:11px}.saas-face .lower-card{margin-top:22px;padding:20px;background:#eaf0f2;border-radius:8px}.saas-face .lower-card .bar{margin:8px 0;height:13px;background:#dce5e8}.saas-face .summary{display:flex;gap:24px;margin-top:36px;align-items:center}.saas-face .summary .icon{width:40px;height:40px}.saas-face .summary .bar{height:16px;width:230px}.saas-face .summary>.bar:last-child{margin-left:auto;width:180px}.saas-face .auto{height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px}.saas-face .auto>.field{height:290px;display:grid;place-items:center}.saas-face .auto .icon{color:#fff;width:140px;height:140px}.saas-face .auto .bar{margin:0;height:18px}.saas-face .circle{position:absolute;inset:0;padding:75px}.saas-face .circle .field{width:100%;height:100%;border-radius:50%;display:grid;place-items:center}.saas-face .circle .icon{color:#fff;width:170px;height:170px}.saas-face .queue{display:flex;align-items:center;gap:38px;height:100%}.saas-face .queue>.field{width:240px;height:240px;flex-shrink:0;display:grid;place-items:center}.saas-face .queue .icon{color:#fff;width:130px;height:130px}.saas-face .queue .copy{flex:1}.saas-face .queue .copy>.bar{height:25px}.saas-face .queue .copy>.bar.short{height:18px}.saas-face .queue .stamp{display:flex;gap:16px;align-items:center;margin-top:35px}.saas-face .queue .stamp .icon{color:#b4c1bf;width:36px;height:36px}.saas-face .queue .stamp .bar{height:14px;width:120px}
.saas-face .brand-plane{background:#fff}.saas-face .brand-plane:before,.saas-face .brand-plane:after{display:none}.saas-face .brand-logo{object-fit:contain}
/* Palette tokens start */
.saas-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.saas-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.saas-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.saas-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.saas-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.saas-face .field:not(.brand-plane):before{display:none}.saas-face .field:not(.brand-plane)>.colors{display:none}.saas-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body>
<template id="workspace"><div class="saas-face"><div class="chrome"><span class="icon">{{LAYOUT}}</span><b class="bar"></b><div class="menu"><i></i><i></i><i></i></div></div><div class="lanes"><div class="lane"><b class="bar"></b><div class="task field" data-color-zone=""><span class="icon">{{LAYERS}}</span><div><b class="bar"></b><b class="bar short"></b></div></div><div class="lower-card"><b class="bar"></b><b class="bar short"></b></div></div><div class="lane"><b class="bar"></b><div class="task field pink" data-color-zone=""><span class="icon">{{WORKFLOW}}</span><div><b class="bar"></b><b class="bar short"></b></div></div><div class="lower-card"><b class="bar"></b><b class="bar short"></b></div></div><div class="lane"><b class="bar"></b><div class="task field warm" data-color-zone=""><span class="icon">{{CHECK}}</span><div><b class="bar"></b><b class="bar short"></b></div></div><div class="lower-card"><b class="bar"></b><b class="bar short"></b></div></div></div><div class="summary"><span class="icon">{{CHECK}}</span><b class="bar"></b><b class="bar"></b></div></div></template>
<template id="automation"><div class="saas-face"><div class="auto"><div class="field brand-plane" data-color-zone=""><span class="icon">{{CLAUDE}}</span></div><b class="bar"></b><b class="bar short"></b></div></div></template>
<template id="database"><div class="saas-face"><div class="circle"><div class="field brand-plane" data-color-zone=""><span class="icon">{{FIGMA}}</span></div></div></div></template>
<template id="queue"><div class="saas-face"><div class="queue"><div class="field warm" data-color-zone=""><span class="icon">{{CHECK}}</span></div><div class="copy"><b class="bar"></b><b class="bar short"></b><div class="stamp"><span class="icon">{{LAYERS}}</span><b class="bar"></b></div></div></div></div></template>
<script>const sizes={workspace:[1280,860],automation:[440,620],database:[500,500],queue:[780,420]};for(const t of document.querySelectorAll('template')){const [w,h]=sizes[t.id],wrap=document.createElement('div');wrap.className='preview';wrap.style.cssText=`width:${w*.5}px;height:${h*.5}px`;wrap.innerHTML=t.innerHTML;wrap.firstElementChild.style.cssText=`width:${w}px;height:${h}px;transform:scale(.5);transform-origin:0 0`;document.body.append(wrap)}</script></body></html>
