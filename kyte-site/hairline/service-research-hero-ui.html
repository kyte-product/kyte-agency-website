<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Research hero flat faces</title><style>
html,body{margin:0;background:#ecefef}body{display:flex;flex-wrap:wrap;align-items:start;gap:30px;padding:24px}.preview{position:relative;overflow:hidden}.research-face,.research-face *{box-sizing:border-box}.research-face{background:#fff;color:#858f94;font:18px Arial,sans-serif;padding:34px;overflow:hidden}.research-face .native{display:block;width:100%;height:100%}.research-face .icon{width:30px;height:30px;display:block;color:#a0a9ad;flex-shrink:0}.research-face .head{display:flex;align-items:center;gap:16px;height:48px;margin-bottom:28px}.research-face .head strong{font-size:23px;font-weight:500;color:#7c878e}.research-face .lights{margin-left:auto;display:flex;gap:7px}.research-face .lights i{width:8px;height:8px;border-radius:50%;background:#e0e5e6}.research-face .bar{display:block;height:9px;background:#e7ebed;border-radius:3px;width:100%;margin:12px 0}.research-face .short{width:57%}.research-face .tiny{width:35%}.research-face .sub{font-size:17px;color:#9aa4aa;margin-bottom:18px}.research-face .field{position:relative;isolation:isolate;overflow:hidden;background:var(--art-greenBlue-mint);border-radius:8px}.research-face .field:before{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse at 76% 22%,var(--art-greenBlue-blueLight) 0,transparent 49%),radial-gradient(ellipse at 15% 80%,var(--art-greenBlue-mint) 0,transparent 52%);filter:blur(19px);z-index:-1}.research-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 18px 5px #ffffff82;pointer-events:none}.research-face .pink{background:var(--art-pinkViolet-base)}.research-face .pink:before{background:radial-gradient(ellipse at 78% 85%,var(--art-pinkViolet-violet) 0,transparent 60%),radial-gradient(ellipse at 7% 10%,var(--art-pinkViolet-light) 0,transparent 55%)}.research-face .warm{background:var(--art-amberLime-light)}.research-face .warm:before{background:radial-gradient(ellipse at 86% 28%,var(--art-greenBlue-mint) 0,transparent 57%),radial-gradient(ellipse at 15% 80%,var(--art-amberLime-light) 0,transparent 60%)}.research-face .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.research-face .cluster{background:#fafbfb;border-radius:8px;padding:20px}.research-face .notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.research-face .note{padding:15px;height:95px;border-radius:6px;background:#edf2f2}.research-face .note .bar{height:6px;margin:8px 0;background:#dce5e5}.research-face .note.field .bar{background:#ffffff94}.research-face .board-bottom{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin-top:28px}.research-face .panel{padding:24px;background:#f9fafb;border-radius:8px}.research-face .flow{display:flex;align-items:center;gap:14px;margin:28px 0}.research-face .node{width:25%;height:56px;border-radius:6px;background:#eef1f3;display:grid;place-items:center}.research-face .line{flex:1;height:2px;background:#e0e6e7}.research-face .chart{height:155px;display:flex;align-items:end;gap:18px;padding-top:18px}.research-face .chart i{display:block;flex:1;min-height:20px;border-radius:3px;background:#e0e7e9}.research-face .metric{font-size:26px;color:#9ca7ad}.research-face .person{display:flex;align-items:center;gap:14px;margin:30px 0}.research-face .avatar{width:64px;height:64px;border-radius:50%;padding:16px;flex-shrink:0}.research-face .avatar .icon{color:white;width:100%;height:100%}.research-face .quote{background:#f7f9fa;border-radius:8px;padding:22px;margin:22px 0}.research-face .wave{display:flex;align-items:center;gap:5px;height:58px}.research-face .wave i{flex:1;background:#d5e5e2;border-radius:3px}.research-face .tag{font-size:13px;padding:9px 11px;background:#eef2f3;border-radius:5px;display:inline-block;margin-right:5px}.research-face .finding{display:flex;gap:16px;padding:22px 0;align-items:start}.research-face .badge{width:34px;height:34px;padding:8px;border-radius:50%;flex-shrink:0}.research-face .badge .icon{width:100%;height:100%;color:white}.research-face .finding-copy{flex:1}.research-face .finding-copy .bar{height:7px}.research-face .foot{display:flex;align-items:center;gap:12px;margin-top:22px}.research-face .foot .icon{width:22px;height:22px}.research-face .journey-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.research-face .step{padding:20px;background:#f6f8f9;border-radius:8px}.research-face .step .icon{margin-bottom:18px}.research-face .journey-path{display:flex;align-items:center;gap:10px;margin:24px 14px}.research-face .point{width:18px;height:18px;border-radius:50%;background:#e4ecea}.research-face .screen{display:grid;grid-template-columns:130px 1fr;gap:25px;background:#f8fafb;padding:22px;border-radius:7px}.research-face .sidebar{background:white;padding:14px;border-radius:4px}.research-face .screen-main .field{height:130px;padding:35px}.research-face .screen-main .field .icon{color:white;width:42px;height:42px;margin:auto}.research-face .screen-cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.research-face .screen-cards>div{padding:12px;background:white;border-radius:5px}.research-face .review-note{margin-top:22px;display:flex;gap:14px;align-items:center}.research-face .review-note .icon{width:28px;height:28px}.research-face .review-note .bar{flex:1}.research-face .review-note .tag{color:var(--art-pinkViolet-violet)}
.research-face .cluster.field .sub{color:#fff}.research-face .cluster.field .note{background:#ffffff65}.research-face .cluster.field .note .bar{background:#ffffffa8}.research-face .cluster.field .note.field:before,.research-face .cluster.field .note.field:after{display:none}.research-face .cluster.field:after{box-shadow:inset 0 0 22px 5px #ffffff66}.research-face .head>.icon{width:42px;height:42px}.research-face .head strong{font-size:28px}.research-face .sub{font-size:26px}.research-face .theme{height:220px;display:flex;flex-direction:column;justify-content:space-between}.research-face .theme>.icon{width:115px;height:115px;color:white}.research-face .theme .bar{background:#ffffffa9;height:13px;margin:14px 0}.research-face .theme .bar.short{height:10px}.research-face .person .avatar{width:115px;height:115px;padding:27px}.research-face .person .bar{height:14px}.research-face .wave{height:78px;margin:35px 0}.research-face .quote{padding:28px;margin:30px 0}.research-face .quote .bar{height:14px;margin:20px 0}.research-face .foot .icon{width:36px;height:36px}.research-face .finding{padding:34px 0;align-items:center;gap:22px}.research-face .badge{width:80px;height:80px;padding:18px}.research-face .finding-copy .bar{height:13px;margin:18px 0}.research-face .step>.icon{width:65px;height:65px}.research-face .step .bar{height:12px;margin:12px 0}.research-face .screen-main .field{height:190px;padding:55px}.research-face .screen-main .field .icon{width:72px;height:72px}
/* Palette tokens start */
.research-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.research-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.research-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.research-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.research-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.research-face .field:not(.brand-plane):before{display:none}.research-face .field:not(.brand-plane)>.colors{display:none}.research-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body>
<template id="evidence"><div class="research-face"><div class="head"><span class="icon">{{LAYOUT}}</span><strong>Research workspace</strong><div class="lights"><i></i><i></i><i></i></div></div><div class="bar short" style="height:15px;margin:30px 0 14px"></div><div class="bar tiny"></div><div class="columns" style="margin-top:34px"><div class="cluster field " data-color-zone=""><div class="sub">User needs</div><div class="theme"><span class="icon">{{USER}}</span><div><b class="bar"></b><b class="bar short"></b></div></div></div><div class="cluster field pink" data-color-zone=""><div class="sub">Friction points</div><div class="theme"><span class="icon">{{LINK}}</span><div><b class="bar"></b><b class="bar short"></b></div></div></div><div class="cluster field warm" data-color-zone=""><div class="sub">Opportunities</div><div class="theme"><span class="icon">{{CHECK}}</span><div><b class="bar"></b><b class="bar short"></b></div></div></div></div>
<div class="board-bottom"><div class="panel"><div class="sub">From observation to action</div><div class="flow"><div class="node"><span class="icon">{{USER}}</span></div><i class="line"></i><div class="node"><span class="icon">{{LINK}}</span></div><i class="line"></i><div class="node"><span class="icon">{{CHECK}}</span></div></div><b class="bar"></b><b class="bar short"></b><b class="bar"></b></div><div class="panel"><div class="sub">Evidence by theme</div><div class="chart"><i style="height:45%"></i><i style="height:78%"></i><i class="field" data-color-zone="" style="height:96%"></i><i style="height:62%"></i><i style="height:40%"></i></div></div></div><div class="foot"><span class="icon">{{CHECK}}</span><div class="bar tiny"></div></div></div></template>
<template id="interview"><div class="research-face"><div class="head"><span class="icon">{{USER}}</span><strong>Interview</strong></div><div class="person"><div class="avatar field" data-color-zone=""><span class="icon">{{USER}}</span></div><div style="flex:1"><b class="bar"></b><b class="bar short"></b></div></div><div class="wave"><i style="height:20%"></i><i style="height:44%"></i><i style="height:80%"></i><i style="height:52%"></i><i style="height:96%"></i><i style="height:40%"></i><i style="height:70%"></i><i style="height:28%"></i></div><div class="quote"><b class="bar"></b><b class="bar"></b><b class="bar short"></b></div><div class="foot"><span class="icon">{{CHECK}}</span><b class="bar short"></b></div></div></template>
<template id="priorities"><div class="research-face"><div class="head"><span class="icon">{{CHECK}}</span><strong>Next steps</strong></div><div class="finding"><div class="badge field pink" data-color-zone=""><span class="icon">{{CHECK}}</span></div><div class="finding-copy"><b class="bar"></b><b class="bar short"></b></div></div><div class="finding"><div class="badge field warm" data-color-zone=""><span class="icon">{{CHECK}}</span></div><div class="finding-copy"><b class="bar"></b><b class="bar short"></b></div></div><div class="finding"><div class="badge field " data-color-zone=""><span class="icon">{{CHECK}}</span></div><div class="finding-copy"><b class="bar"></b><b class="bar short"></b></div></div></div></template>
<template id="journey"><div class="research-face"><div class="head"><span class="icon">{{LINK}}</span><strong>Journey and task flow</strong></div><div class="journey-grid"><div class="step"><span class="icon">{{USER}}</span><b class="bar"></b><b class="bar short"></b></div><div class="step"><span class="icon">{{LAYOUT}}</span><b class="bar"></b><b class="bar short"></b></div><div class="step field warm" data-color-zone=""><span class="icon" style="color:white">{{LINK}}</span><b class="bar" style="background:#ffffff94"></b><b class="bar short" style="background:#ffffff94"></b></div><div class="step"><span class="icon">{{CHECK}}</span><b class="bar"></b><b class="bar short"></b></div></div><div class="journey-path"><i class="point"></i><i class="line"></i><i class="point"></i><i class="line"></i><i class="point"></i><i class="line"></i><i class="point"></i></div><div class="bar short"></div></div></template>
<template id="usability"><div class="research-face"><div class="head"><span class="icon">{{LAYOUT}}</span><strong>Usability review</strong><div class="lights"><i></i><i></i><i></i></div></div><div class="screen"><div class="sidebar"><b class="bar"></b><b class="bar short"></b><b class="bar" style="margin-top:36px"></b><b class="bar"></b><b class="bar"></b></div><div class="screen-main"><div class="field" data-color-zone=""><span class="icon">{{LAYOUT}}</span></div><div class="screen-cards"><div><b class="bar"></b><b class="bar short"></b></div><div><b class="bar"></b><b class="bar short"></b></div></div></div></div><div class="review-note"><span class="icon">{{LINK}}</span><b class="bar"></b><span class="tag">Finding 01</span></div><div class="review-note"><span class="icon">{{CHECK}}</span><b class="bar"></b><span class="tag">Finding 02</span></div></div></template>
<script>const sizes={evidence:[1460,1060],interview:[450,760],priorities:[480,720],journey:[1300,540],usability:[720,640]};for(const t of document.querySelectorAll('template')){const [w,h]=sizes[t.id],wrap=document.createElement('div');wrap.className='preview';wrap.style.cssText=`width:${w*.55}px;height:${h*.55}px`;wrap.innerHTML=t.innerHTML;const face=wrap.firstElementChild;face.style.cssText=`width:${w}px;height:${h}px;transform:scale(.55);transform-origin:0 0`;document.body.append(wrap)}</script></body></html>
