<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Commerce assembly flat faces</title><style>
html,body{margin:0;background:#ecefef}body{display:flex;flex-wrap:wrap;gap:26px;padding:24px;align-items:start}.preview{overflow:hidden;position:relative}.commerce-face,.commerce-face *{box-sizing:border-box}.commerce-face{position:relative;background:white;color:#a4afb3;overflow:hidden;padding:44px;font:24px Arial,sans-serif}.commerce-face .native{display:block;width:100%;height:100%}.commerce-face .icon{display:block;width:54px;height:54px;flex-shrink:0}.commerce-face .bar{display:block;background:#e3e9eb;height:20px;border-radius:6px;width:100%;margin:20px 0}.commerce-face .short{width:64%}.commerce-face .small{width:38%}.commerce-face .field{position:relative;isolation:isolate;overflow:hidden;background:var(--art-greenBlue-mint);border-radius:16px}.commerce-face .field:before{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse at 84% 14%,var(--art-greenBlue-blueLight) 0,transparent 53%),radial-gradient(ellipse at 12% 84%,var(--art-greenBlue-mint) 0,transparent 56%);filter:blur(27px);z-index:-1}.commerce-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 28px 7px #ffffff77;pointer-events:none}.commerce-face .pink{background:var(--art-pinkViolet-base)}.commerce-face .pink:before{background:radial-gradient(ellipse at 87% 86%,var(--art-pinkViolet-violet) 0,transparent 59%),radial-gradient(ellipse at 8% 12%,var(--art-pinkViolet-light) 0,transparent 55%)}.commerce-face .warm{background:var(--art-amberLime-light)}.commerce-face .warm:before{background:radial-gradient(ellipse at 84% 16%,var(--art-greenBlue-mint) 0,transparent 58%),radial-gradient(ellipse at 10% 82%,var(--art-amberLime-light) 0,transparent 55%)}.commerce-face .products{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;margin-top:42px}.commerce-face .featured{height:420px;display:grid;place-items:center}.commerce-face .featured .icon{width:170px;height:170px;color:white}.commerce-face .secondary{height:230px;display:grid;place-item :44px;height:44px}.commerce-face .shop-chrome>.bar{width:230px;height:18px}.commerce-face .shop-chrome .lights{margin-left:auto;display:flex;gap:12px}.commerce-face .lights i{width:13px;height:13px;border-radius:50%;background:#dce5e8}.commerce-face .terminal{padding:20px}.commerce-face .terminal>.bar{height:24px}.commerce-face .payment{height:350px}.commerce-face .payment .icon{width:170px;height:170px}.commerce-face .pay-action{height:96px}.commerce-face .pay-action .icon{width:60px;height:60px}.commerce-face .confirmed{position:absolute;inset:0;padding:68px}.commerce-face .confirmed>.field{width:100%;height:100%;border-radius:50%;display:grid;place-items:center}.commerce-face .confirmed .icon{width:160px;height:160px;color:white}

.commerce-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.commerce-face .field:not(.brand-plane):before{display:none}.commerce-face .field:not(.brand-plane)>.colors{display:none}.commerce-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}

<template id="storefront"><div class="commerce-face"><div class="shop-chrome"><span class="icon">{{BAG}}</span><b class="bar"></b><div class="lights"><i></i><i></i><i></i></div></div><div class="products"><div><div class="featured field warm" data-color-zone=""><span class="icon">{{BAG}}</span></div><div class="product-copy"><b class="bar"></b><b class="bar short"></b></div></div><div><div class="secondary field pink" data-color-zone=""><span class="icon">{{PACKAGE}}</span></div><div class="secondary-copy"><b class="bar"></b><b class="bar short"></b></div><div class="action field" data-color-zone=""><b class="bar"></b><span class="icon">{{ARROW}}</span></div></div></div></div></template>

<template id="checkout"><div class="commerce-face"><div class="terminal"><b class="bar short"></b><div class="payment field" data-color-zone=""><span class="icon">{{CARD}}</span></div><b class="bar"></b><b class="bar short"></b><div class="pay-action field pink" data-color-zone=""><span class="icon">{{CHECK}}</span></div></div></div></template>
<template id="parcel"><div class="commerce-face"><div class="parcel"><span class="icon" data-color-zone="">{{SHOPIFY}}</span></div></div></template>
<template id="confirmation"><div class="commerce-face"><div class="confirmed"><div class="field" data-color-zone=""><span class="icon">{{CHECK}}</span></div></div></div></template>
<script>const sizes={storefront:[1300,800],checkout:[640,900],parcel:[460,460],confirmation:[460,460]};for(const t of document.querySelectorAll('template')){const [w,h]=sizes[t.id],wrap=document.createElement('div');wrap.className='preview';wrap.style.cssText=`width:${w*.5}px;height:${h*.5}px`;wrap.innerHTML=t.innerHTML;wrap.firstElementChild.style.cssText=`width:${w}px;height:${h}px;transform:scale(.5);transform-origin:0 0`;document.body.append(wrap)}</script></body></html>
