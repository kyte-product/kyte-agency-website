<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mobile assembly flat faces</title><style>
html,body{margin:0;background:#ecefef}body{display:flex;flex-wrap:wrap;gap:26px;padding:24px;align-items:start}.preview{overflow:hidden;position:relative}.mobile-face,.mobile-face *{box-sizing:border-box}.mobile-face{position:relative;background:white;color:#a4afb3;overflow:hidden;padding:44px;font:24px Arial,sans-serif}.mobile-face .native{display:block;width:100%;height:100%}.mobile-face .icon{display:block;width:54px;height:54px;flex-shrink:0}.mobile-face .bar{display:block;background:#e3e9eb;height:20px;border-radius:6px;width:100%;margin:20px 0}.mobile-face .short{width:64%}.mobile-face .small{width:38%}.mobile-face .field{position:relative;isolation:isolate;overflow:hidden;background:var(--art-greenBlue-mint);border-radius:16px}.mobile-face .field:before{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse at 84% 14%,var(--art-greenBlue-blueLight) 0,transparent 53%),radial-gradient(ellipse at 12% 84%,var(--art-greenBlue-mint) 0,transparent 56%);filter:blur(27px);z-index:-1}.mobile-face .field:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 28px 7px #ffffff77;pointer-events:none}.mobile-face .pink{background:var(--art-pinkViolet-base)}.mobile-face .pink:before{background:radial-gradient(ellipse at 87% 86%,var(--art-pinkViolet-violet) 0,transparent 59%),radial-gradient(ellipse at 8% 12%,var(--art-pinkViolet-light) 0,transparent 55%)}.mobile-face .warm{background:var(--art-amberLime-light)}.mobile-face .warm:before{background:radial-gradient(ellipse at 84% 16%,var(--art-greenBlue-mint) 0,transparent 58%),radial-gradient(ellipse at 10% 82%,var(--art-amberLime-light) 0,transparent 55%)}.mobile-face .camera{width:140px;height:23px;background:#e1e7e9;border-radius:20px;margin:-12px auto 48px}.mobile-face .head{display:flex;align-items:center;gap:26px;margin-bottom:34px}.mobile-face .head .bar{height:25px;width:260px}.mobile-face .head .icon{margin-left:auto;width:43px;height:43px}.mobile-face .feature{height:350px;display:grid;place-items:center}.mobile-face .feature .icon{color:#fff;width:125px;height:125px}.mobile-face .headline{margin-top:34px}.mobile-face .headline .bar{height:32px}.mobile-face .tiles{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:46px}.mobile-face .tile{background:#f5f7f8;border-radius:14px;padding:26px;height:176px}.mobile-face .tile .icon{width:54px;height:54px}.mobile-face .tile .bar{height:14px}.mobile-face .navigation{display:flex;align-items:center;justify-content:space-between;margin-top:48px;padding:26px 20px}.mobile-face .navigation .icon{width:44px;height:44px}.mobile-face .home{width:170px;height:17px;border-radius:20px;background:#e0e6e8;margin:26px auto 0}.mobile-face .circle{position:absolute;inset:0;padding:95px}.mobile-face .circle>.field{width:100%;height:100%;border-radius:50%;display:grid;place-items:center}.mobile-face .circle .icon{width:170px;height:170px;color:white}.mobile-face .hex-inner{padding:145px}.mobile-face .arch{display:flex;flex-direction:column;align-items:center;padding-top:56px}.mobile-face .arch>.field{width:300px;height:300px;border-radius:50%;display:grid;place-items:center}.mobile-face .arch .icon{width:140px;height:140px;color:white}.mobile-face .arch .bar{height:25px;margin-top:50px;margin-bottom:0;width:290px}.mobile-face .arch .bar.short{width:180px;margin-top:24px;height:17px}.mobile-face .interaction{position:absolute;inset:22px;display:flex;align-items:center;gap:45px;padding:34px 42px}.mobile-face .interaction .icon{width:105px;height:105px;color:#fff}.mobile-face .interaction .copy{flex:1}.mobile-face .interaction .bar{background:#ffffffaa;margin:16px 0;height:24px}.mobile-face .interaction .bar.short{height:16px}.mobile-face .interaction .arrow{width:70px;height:70px}
.mobile-face .brand-plane{background:#fff}.mobile-face .brand-plane:before,.mobile-face .brand-plane:after{display:none}.mobile-face .brand-logo{object-fit:contain}
/* Palette tokens start */
.mobile-face{--art-greenBlue-base:#3dbfcc;--art-greenBlue-mint:#79edc9;--art-greenBlue-blueLight:#4babf7;--art-greenBlue-green:#44d091;--art-greenBlue-greenDeep:#39c187;--art-greenBlue-blue:#2a94e2;--art-greenBlue-teal:#36b7bb;--art-amberGreen-base:#f0a91a;--art-amberGreen-amber:#fda30c;--art-amberGreen-gold:#f4b829;--art-amberGreen-lime:#cbc53b;--art-amberGreen-green:#0db340;--art-amberGreen-olive:#91ae36;--art-amberGreen-light:#d0cb30;--art-amberLime-base:#f7a70f;--art-amberLime-orange:#ff8f02;--art-amberLime-amber:#feaa15;--art-amberLime-lime:#accc1e;--art-amberLime-green:#65b446;--art-amberLime-gold:#bbb733;--art-amberLime-light:#dcc640;--art-pinkViolet-base:#fb8bbe;--art-pinkViolet-coral:#fd91af;--art-pinkViolet-pink:#fd73b7;--art-pinkViolet-violet:#c396fd;--art-pinkViolet-rose:#fc92b8;--art-pinkViolet-light:#fcaedd;--art-pinkViolet-deep:#c596ff;--art-coralViolet-base:#fd88ae;--art-coralViolet-coral:#fc8297;--art-coralViolet-pink:#fb6fc4;--art-coralViolet-violet:#c590fd;--art-coralViolet-rose:#fd92ae;--art-coralViolet-light:#fba6df;--art-coralViolet-deep:#ec91f9;--art-amberViolet-base:#f1994c;--art-amberViolet-light:#ebaaa5;--art-amberViolet-orange:#f3924f;--art-amberViolet-violet:#d5aaed;--art-amberViolet-amber:#f2bb63;--art-amberViolet-coral:#f3b173;--art-amberViolet-rose:#eeb99f;--art-mintCyan-base:#44ce88;--art-mintCyan-mint:#6be4af;--art-mintCyan-blue:#49c3d0;--art-mintCyan-teal:#3cbfb0;--art-mintCyan-green:#7cdbaa;--art-mintCyan-cyan:#75ccdb;--art-mintCyan-light:#57db9f;--art-signal-error:#fc8277;--art-signal-warning:#f2c85b;--art-signal-success:#7cd37b}
/* Palette tokens end */

/* Approved material start */
.mobile-face .field:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-greenBlue-blueLight) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-greenBlue-blue) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-greenBlue-teal) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-greenBlue-greenDeep) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-greenBlue-green) 12%,transparent 96%),var(--art-greenBlue-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field.warm:not(.brand-plane){background:radial-gradient(ellipse 72% 78% at 24% 38%,var(--art-amberLime-orange) 12%,transparent 95%),radial-gradient(ellipse 64% 70% at 91% 78%,var(--art-amberLime-green) 10%,transparent 98%),radial-gradient(ellipse 58% 61% at 58% 8%,var(--art-amberLime-amber) 8%,transparent 98%),var(--art-amberLime-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field.pink:not(.brand-plane){background:radial-gradient(ellipse 72% 70% at 13% 17%,var(--art-pinkViolet-coral) 8%,transparent 98%),radial-gradient(ellipse 67% 74% at 88% 87%,var(--art-pinkViolet-violet) 10%,transparent 98%),radial-gradient(ellipse 57% 67% at 48% 60%,var(--art-pinkViolet-pink) 8%,transparent 98%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field.violet:not(.brand-plane){background:radial-gradient(ellipse 48% 55% at 58% 20%,var(--art-pinkViolet-pink) 12%,transparent 93%),radial-gradient(ellipse 48% 48% at 91% 44%,var(--art-pinkViolet-rose) 8%,transparent 96%),radial-gradient(ellipse 55% 51% at 88% 99%,var(--art-pinkViolet-violet) 10%,transparent 96%),radial-gradient(ellipse 45% 45% at 24% 100%,var(--art-pinkViolet-light) 8%,transparent 96%),radial-gradient(ellipse 48% 73% at 8% 63%,var(--art-pinkViolet-coral) 12%,transparent 96%),var(--art-pinkViolet-base);box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}.mobile-face .field:not(.brand-plane):before{display:none}.mobile-face .field:not(.brand-plane)>.colors{display:none}.mobile-face .field:not(.brand-plane):after{background:none;box-shadow:inset 0 0 18px 3px #ffffff66,inset 0 0 3px 1px #ffffff45}
/* Approved material end */
</style></head><body>
<template id="phone"><div class="mobile-face"><div class="camera"></div><div class="head"><b class="bar"></b><span class="icon">{{USER}}</span></div><div class="feature field" data-color-zone=""><span class="icon">{{LAYOUT}}</span></div><div class="headline"><b class="bar"></b><b class="bar short"></b></div><div class="tiles"><div class="tile"><span class="icon">{{BELL}}</span><b class="bar"></b></div><div class="tile"><span class="icon">{{CHECK}}</span><b class="bar"></b></div></div><div class="navigation"><span class="icon">{{LAYOUT}}</span><span class="icon">{{USER}}</span><span class="icon">{{BELL}}</span></div><div class="home"></div></div></template>
<template id="identity"><div class="mobile-face"><div class="circle"><div class="field brand-plane" data-color-zone=""><span class="icon">{{FIGMA}}</span></div></div></div></template>
<template id="notifications"><div class="mobile-face"><div class="arch"><div class="field brand-plane" data-color-zone=""><span class="icon">{{CLAUDE}}</span></div><b class="bar"></b><b class="bar short"></b></div></div></template>
<template id="interaction"><div class="mobile-face"><div class="interaction field pink" data-color-zone=""><span class="icon">{{TOUCH}}</span><div class="copy"><b class="bar"></b><b class="bar short"></b></div><span class="icon arrow">{{ARROW}}</span></div></div></template>
<template id="completion"><div class="mobile-face"><div class="circle hex-inner"><div class="field" data-color-zone=""><span class="icon">{{CHECK}}</span></div></div></div></template>
<script>const sizes={phone:[700,1300],identity:[560,560],notifications:[520,680],interaction:[920,280],completion:[600,600]};for(const t of document.querySelectorAll('template')){const [w,h]=sizes[t.id],wrap=document.createElement('div');wrap.className='preview';wrap.style.cssText=`width:${w*.5}px;height:${h*.5}px`;wrap.innerHTML=t.innerHTML;wrap.firstElementChild.style.cssText=`width:${w}px;height:${h}px;transform:scale(.5);transform-origin:0 0`;document.body.append(wrap)}</script></body></html>
